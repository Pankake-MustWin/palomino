<script>
/* ============================================================
   EDYTUJ TUTAJ - Cennik warsztatu
   ============================================================

   MENU - pozycje dostepne dla wszystkich
   { id, name, price, emoji }
   - price = cena bazowa (dla 1 sztuki / gdy pozycja nie ma progow)

   TIERS - progi cenowe dla wybranych pozycji z MENU (opcjonalnie)
   {
     id_pozycji: [ { minQty, price }, ... ]  -- posortowane rosnaco po minQty
   }
   Cena za sztuke zmienia sie automatycznie w zaleznosci od ilosci
   dodanej na cenniku. Pierwszy prog (minQty:1) powinien miec cene
   rowna cenie bazowej z MENU.

   COMPANIES - ekipy / firmy ze znizka (opcjonalnie)
   {
     id, name, suffix,
     discounts: { id_pozycji: cena }
     - brak wpisu = normalna cena / progi jak zwykle, brak dopisku
     - liczba     = stala znizka + dopisek suffix na "fakturze" (ignoruje progi)
     - null       = zablokowana pozycja
   }
   ============================================================ */

const MENU = [
  { id: 'naprawa',  name: 'Naprawa',  price: 75,  emoji: '\uD83D\uDD27' },
  { id: 'wytrych',  name: 'Wytrych',  price: 125, emoji: '\uD83D\uDDDD\uFE0F' },
  { id: 'mycie',    name: 'Mycie',    price: 20,  emoji: '\uD83E\uDDFD' },
  { id: 'ceramika', name: 'Ceramika', price: 35,  emoji: '\u2728' },
];

const TIERS = {
  wytrych: [
    { minQty: 1,  price: 125 },
    { minQty: 5,  price: 100 },
    { minQty: 10, price: 80  },
  ],
};

const COMPANIES = [
  /* --- PRZYKLAD ekipy ze znizka - odkomentuj i wypelnij ---
  {
    id:     'ekipa',
    name:   'Ekipa VIP',
    suffix: 'VIP',
    discounts: {
      naprawa: 50,
      mycie:   10,
    }
  },
  ----------------------------------------------------------- */
];

const SETTINGS = {
  currency:         '$',
  copyAllSeparator: ' - ',
};

// Funkcja formatująca liczby BEZ spacji
function formatNumber(num) {
    return num.toString();
}
</script>
<style>

<script>
/* ── State ── */
const qty = {};
MENU.forEach(i => { qty[i.id] = 0; });

let mode = { type: 'normal', data: null };
let light = false;

/* ── Tier helpers ── */
function getTierForQty(id, q) {
  const t = TIERS[id];
  if (!t) return null;
  let cur = t[0];
  t.forEach(row => { if (q >= row.minQty) cur = row; });
  return cur;
}
function nextTierAbove(id, q) {
  const t = TIERS[id];
  if (!t) return null;
  return t.find(row => row.minQty > q) || null;
}

/* ── Normal/company/tier price helpers ── */
function getPrice(item) {
  if (mode.type === 'company') {
    const d = mode.data.discounts;
    if (!Object.prototype.hasOwnProperty.call(d, item.id)) {
      // brak wpisu u firmy -> normalna logika (progi jesli sa)
    } else if (d[item.id] === null) {
      return null;
    } else {
      return d[item.id];
    }
  }
  const t = TIERS[item.id];
  if (t) {
    const q = Math.max(1, qty[item.id] || 1);
    return getTierForQty(item.id, q).price;
  }
  return item.price;
}
function hasDiscount(item) {
  if (mode.type === 'company') {
    const d = mode.data.discounts;
    if (Object.prototype.hasOwnProperty.call(d, item.id) && d[item.id] !== null) return true;
  }
  const t = TIERS[item.id];
  if (t) {
    const q = Math.max(1, qty[item.id] || 1);
    return getTierForQty(item.id, q).price !== item.price;
  }
  return false;
}
function getLabel(item) {
  if (mode.type === 'company') {
    const d = mode.data.discounts;
    if (Object.prototype.hasOwnProperty.call(d, item.id) && d[item.id] !== null) {
      return item.name + ' ' + mode.data.suffix;
    }
  }
  return item.name;
}

/* ── Tab bar ── */
function buildTabBar() {
  const bar = document.getElementById('tabBar');
  let html = '<button class="tab-chip act-normal" id="tab_normal" onclick="setMode(\'normal\',null)">Cennik</button>';
  COMPANIES.forEach(c => {
    html += '<button class="tab-chip" id="tab_' + c.id + '" onclick="setMode(\'company\',\'' + c.id + '\')">' + c.name + '</button>';
  });
  bar.innerHTML = html;
}

function setMode(type, id) {
  mode = type === 'normal' ? { type: 'normal', data: null } : { type: 'company', data: COMPANIES.find(c => c.id === id) };

  document.querySelectorAll('.tab-chip').forEach(el => el.classList.remove('act-normal', 'act-company'));
  const chip = document.getElementById('tab_' + (type === 'normal' ? 'normal' : id));
  if (chip) chip.classList.add(type === 'normal' ? 'act-normal' : 'act-company');

  document.getElementById('menuLabel').textContent = type === 'normal'
    ? '\uD83D\uDD29 Us\u0142ugi'
    : '\uD83D\uDD29 Us\u0142ugi \u2014 ' + mode.data.name;

  if (type === 'company') MENU.forEach(item => { if (getPrice(item) === null) qty[item.id] = 0; });

  renderArea();
  update();
}

/* ── Render ── */
function renderArea() {
  const area = document.getElementById('menuArea');

  area.innerHTML = '<div class="menu-grid">'
    + MENU.map(item => {
      const price = getPrice(item);
      const unavail = price === null;
      const disc = hasDiscount(item);
      const t = TIERS[item.id];
      const isActive = qty[item.id] > 0;

      let priceHtml = unavail
        ? '<span style="font-style:italic;opacity:.5">niedost\u0119pne</span>'
        : disc
          ? '<span class="price-orig">' + formatNumber(item.price) + SETTINGS.currency + '</span><span class="price-disc">' + formatNumber(price) + SETTINGS.currency + '</span>'
          : formatNumber(price) + SETTINGS.currency;

      // Hint o progach (tylko gdy karta nie jest jeszcze rozwinieta, mode normalny)
      let tierHint = '';
      if (t && mode.type === 'normal' && !isActive) {
        tierHint = '<div class="tier-hint">' + t.slice(1).map(r => r.minQty + '+ = ' + formatNumber(r.price) + SETTINGS.currency + '/szt').join(' &middot; ') + '</div>';
      }

      const topRow = '<div class="top-row"><div class="item-info"><div class="item-name"><span class="item-emoji">' + item.emoji + '</span>' + item.name + '</div>'
        + '<div class="item-price">' + priceHtml + '</div>' + tierHint + '</div>'
        + '<div class="qty-ctrl">'
        + '<button class="qty-btn" onclick="change(\'' + item.id + '\',-1)">&#x2212;</button>'
        + '<span class="qty-num" id="q_' + item.id + '">' + qty[item.id] + '</span>'
        + '<button class="qty-btn" onclick="change(\'' + item.id + '\',1)">+</button>'
        + '</div></div>';

      // Drabinka progow - widoczna tylko gdy pozycja ma progi, jest aktywna i tryb normalny
      let ladderHtml = '';
      if (t && mode.type === 'normal' && isActive) {
        const curTier = getTierForQty(item.id, qty[item.id]);
        ladderHtml = '<div class="tier-ladder">' + t.map((row, idx) => {
          const nextMin = t[idx + 1] ? t[idx + 1].minQty : null;
          const label = nextMin ? (row.minQty + '\u2013' + (nextMin - 1) + ' szt.') : (row.minQty + '+ szt.');
          const on = curTier.minQty === row.minQty;
          return '<div class="tier-row' + (on ? ' on' : '') + '"><span class="tq">' + label + '</span><span class="tp">' + formatNumber(row.price) + SETTINGS.currency + '</span></div>';
        }).join('') + '</div>';
      }

      const cardCls = 'item-card' + (unavail ? ' unavail' : '') + (isActive ? ' active' : '') + (t ? ' tiered' : '');
      return '<div class="' + cardCls + '" id="card_' + item.id + '">' + topRow + ladderHtml + '</div>';
    }).join('')
    + '</div>';
}

/* ── Change handlers ── */
function change(id, delta) {
  qty[id] = Math.max(0, qty[id] + delta);
  renderArea();
  update();
}

/* ── Build strings ── */
function buildStrings() {
  let orderParts = [], total = 0;

  MENU.forEach(item => {
    const p = getPrice(item);
    if (p !== null && qty[item.id] > 0) {
      orderParts.push(qty[item.id] + 'x ' + getLabel(item));
      total += qty[item.id] * p;
    }
  });

  const hasItems = orderParts.length > 0 && total >= 0;
  const orderStr = orderParts.join(', ');
  const priceStr = formatNumber(total) + SETTINGS.currency;
  return { hasItems, orderStr, priceStr, total };
}

/* ── Update UI ── */
function update() {
  const { hasItems, orderStr, priceStr, total } = buildStrings();
  document.getElementById('orderText').innerHTML = hasItems ? orderStr : '<span style="color:var(--muted);font-style:italic;font-size:12px;">Dodaj us\u0142ugi...</span>';
  document.getElementById('priceText').innerHTML = hasItems ? priceStr : '<span style="color:var(--muted);font-style:italic;font-size:12px;">0' + SETTINGS.currency + '</span>';
  document.getElementById('totalVal').textContent = formatNumber(total) + SETTINGS.currency;
  ['copyOrderBtn', 'copyPriceBtn', 'copyAllBtn'].forEach(id => { document.getElementById(id).disabled = !hasItems; });
}

/* ── Copy ── */
function flash(id, label) {
  const btn = document.getElementById(id);
  const orig = btn.textContent; btn.textContent = label; btn.classList.add('done');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 2000);
}
function copyText(text, btnId, label) {
  const done = () => flash(btnId, label);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, btnId, label));
  } else { fallbackCopy(text, btnId, label); }
}
function fallbackCopy(text, btnId, label) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); flash(btnId, label); } catch (e) { alert('Skopiuj r\u0119cznie:\n' + text); }
  document.body.removeChild(ta);
}
function copyField(type) {
  const { orderStr, priceStr } = buildStrings();
  copyText(type === 'order' ? orderStr : priceStr, type === 'order' ? 'copyOrderBtn' : 'copyPriceBtn', '\u2713 Skopiowano!');
}
function copyAll() {
  const { orderStr, priceStr } = buildStrings();
  copyText(orderStr + SETTINGS.copyAllSeparator + priceStr, 'copyAllBtn', '\u2713 Skopiowano wszystko!');
}

/* ── Reset ── */
function resetOrder() {
  MENU.forEach(i => { qty[i.id] = 0; });
  renderArea(); update();
}

/* ── Theme ── */
function toggleTheme() {
  light = !light;
  document.body.classList.toggle('light', light);
  document.getElementById('themeBtn').textContent = light ? '\uD83C\uDF19 Ciemny' : '\u2600\uFE0F Jasny';
}

/* ── Init ── */
buildTabBar();
renderArea();
update();
</script>
